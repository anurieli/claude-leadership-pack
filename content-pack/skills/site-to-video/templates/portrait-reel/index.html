<!--
  Template: portrait-reel
  Aspect: 1080×1920 portrait (Stories / TikTok / Reels), 30s, 5 beats × 6s
  Captions positioned higher (mid-frame) since bottom is where the platform UI sits.
  Replace TODO markers with site-specific content. See ../../references/composition-rules.md.
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #0A0A0A;
    --paper: #F5F1E8;
    --accent: #FF5B2E;
    --accent-soft: #FFD9CC;
  }
  html, body { margin: 0; background: var(--ink); }
  #root { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  .scene { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 60px; box-sizing: border-box; }
  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 100;
    mix-blend-mode: multiply; opacity: 0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  /* Captions sit at vertical center-bottom, AVOIDING bottom 280px (TikTok caption bar + UI) */
  .caption-layer { position: absolute; left: 0; right: 0; bottom: 320px; display: flex; justify-content: center; z-index: 90; padding: 0 60px; }
  .caption {
    position: absolute; opacity: 0;
    background: var(--ink); color: var(--paper);
    font-weight: 700; font-size: 44px; padding: 16px 24px; border-radius: 6px;
    box-shadow: 5px 5px 0 var(--accent); text-align: center; max-width: 900px;
  }
  /* Portrait composition rule: vertical stack, NOT horizontal columns. */
</style>
</head>
<body>

<div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">

  <audio id="narration" src="audio/narration.wav" data-start="0" data-duration="30" data-track-index="0" data-volume="1"></audio>
  <audio id="music"     src="audio/music.wav"     data-start="0" data-duration="30" data-track-index="1" data-volume="0.12"></audio>

  <div class="scene" id="s1"><!-- TODO: hook — vertical stack, big headline --></div>
  <div class="scene" id="s2"><!-- TODO: stakes --></div>
  <div class="scene" id="s3"><!-- TODO: solution --></div>
  <div class="scene" id="s4"><!-- TODO: proof --></div>
  <div class="scene" id="s5"><!-- TODO: CTA --></div>

  <div class="caption-layer">
    <!-- One caption div per sentence -->
  </div>

  <div class="grain"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });

  const beats = [0, 6, 12, 18, 24, 30];
  const ids = ['s1','s2','s3','s4','s5'];
  ids.forEach((id, i) => {
    tl.to(`#${id}`, { opacity: 1, duration: 0.4 }, beats[i]);
    if (i < ids.length - 1) {
      tl.to(`#${id}`, { opacity: 0, duration: 0.4 }, beats[i+1] - 0.2);
    }
  });

  tl.set({}, {}, 30);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>

</body>
</html>

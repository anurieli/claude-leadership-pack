<!--
  Template: launch-teaser-15s
  Aspect: 1920×1080 landscape, 15s, 3 beats × 5s
  High-energy, music-driven. Sparse VO (or none — let captions carry the words).
  Replace TODO markers with site-specific content. See ../../references/composition-rules.md.
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #0A0A0A;
    --paper: #F5F1E8;
    --accent: #FF5B2E;
    --accent-soft: #FFD9CC;
  }
  html, body { margin: 0; background: var(--ink); }
  #root { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  .scene { position: absolute; inset: 0; opacity: 0; display: flex; align-items: center; justify-content: center; }
  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 100;
    mix-blend-mode: multiply; opacity: 0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .caption-layer { position: absolute; left: 0; right: 0; bottom: 80px; display: flex; justify-content: center; z-index: 90; }
  .caption {
    position: absolute; opacity: 0;
    background: var(--accent); color: var(--paper);
    font-weight: 800; font-size: 56px; padding: 16px 28px; border-radius: 4px;
    box-shadow: 6px 6px 0 var(--ink); text-transform: uppercase; letter-spacing: 0.04em;
  }
  /* Teasers prioritize ONE big visual idea per beat. No text density. */
</style>
</head>
<body>

<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">

  <!-- Music-first: VO optional, music dominant (volume up to 0.35 if no VO). -->
  <audio id="music" src="audio/music.wav" data-start="0" data-duration="15" data-track-index="0" data-volume="0.35"></audio>
  <!-- <audio id="narration" src="audio/narration.wav" data-start="0" data-duration="15" data-track-index="1" data-volume="1"></audio> -->
  <!-- Whoosh on each beat boundary feels right -->
  <!-- <audio id="sfx-whoosh-1" src="audio/sfx/whoosh.mp3" data-start="4.8" data-duration="0.5" data-track-index="20"></audio> -->

  <div class="scene" id="s1"><!-- TODO: tease — what is this thing? --></div>
  <div class="scene" id="s2"><!-- TODO: reveal — show the product --></div>
  <div class="scene" id="s3"><!-- TODO: lock — logo + date or CTA --></div>

  <div class="caption-layer">
    <!-- BIG punch words, one per beat. -->
  </div>

  <div class="grain"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });

  const beats = [0, 5, 10, 15];
  const ids = ['s1','s2','s3'];
  ids.forEach((id, i) => {
    tl.to(`#${id}`, { opacity: 1, duration: 0.25 }, beats[i]);
    if (i < ids.length - 1) {
      tl.to(`#${id}`, { opacity: 0, duration: 0.25 }, beats[i+1] - 0.1);
    }
  });

  tl.set({}, {}, 15);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>

</body>
</html>
